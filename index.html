<style>
/* La marca es negra en cualquier tema del visor: los tokens no cambian entre claro y oscuro. */
:root,:root[data-theme="dark"]{
  --bg:#000000; --surface:#161616; --surface2:#222222; --line:#333333;
  --text:#f5f5f5; --muted:#a9a9a9;
  --red:#c8202b; --red-hi:#ea3a45; --mustard:#e0a81c; --mustard-dim:#7a5c10;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:92px;-webkit-text-size-adjust:100%}
img,svg{max-width:100%}
button,input,select{font:inherit;color:inherit}
.disp{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;font-weight:900;line-height:.95;letter-spacing:.005em}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 0}
h1,h2,h3,p{margin:0}
h2.disp{font-size:34px;margin-bottom:10px}
h3{font-size:18px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}
.mus{color:var(--mustard)}
.red{color:var(--red-hi)}

/* encabezado */
.top{display:flex;align-items:baseline;justify-content:space-between;padding:6px 0 14px}
.mark{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;font-weight:900;font-size:26px;color:var(--mustard);letter-spacing:.02em}
.mark i{display:inline-block;width:9px;height:9px;background:var(--red);margin-left:5px;transform:translateY(-1px)}
.wk{font-size:14px;color:var(--muted)}
.logo{display:block;align-self:center;height:40px;width:auto;max-width:62%;object-fit:contain;background:#fff;padding:4px 10px;border-radius:6px;box-sizing:border-box}
.logo.bare{background:transparent;padding:0;height:36px}
.lock{display:flex;align-items:center;gap:7px;min-width:0}
.bear-ico{width:20px;height:20px;flex:0 0 auto;fill:var(--mustard);opacity:.9}
.mk2{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}

/* tarjetas */
.motiv{border-left:3px solid var(--mustard)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card.flat{background:transparent}
.row{display:flex;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border:0;border-radius:8px;background:var(--red);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
.btn:active{background:var(--red-hi)}
.btn.alt{background:transparent;border:1.5px solid var(--mustard);color:var(--mustard)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}

/* chips y opciones */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:8px 14px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.chip.on{border-color:var(--mustard);background:var(--mustard);color:#000;font-weight:700}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.opt b{display:block;font-size:18px}
.opt span{color:var(--muted);font-size:14px}
.opt.on{border-color:var(--mustard);box-shadow:inset 4px 0 0 var(--mustard)}
.opt.on span{color:var(--text)}

/* formularios */
label.f{display:block;margin-bottom:12px;font-size:14px;color:var(--muted)}
label.f input{display:block;width:100%;margin-top:4px;min-height:48px;padding:8px 12px;border-radius:8px;border:1.5px solid var(--line);background:#000;color:var(--text);font-size:18px}
label.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);margin:12px 0}
label.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--red)}
.err{color:var(--red-hi);font-weight:600;margin:8px 0}
.prog{display:flex;gap:6px;margin:4px 0 18px}
.prog b{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog b.on{background:var(--mustard)}

/* portada */
.hero{padding:26px 0 8px}
.hero h1{font-size:64px;color:var(--text)}
.hero h1 em{font-style:normal;color:var(--red-hi)}
.hero p{font-size:18px;margin:16px 0 26px;color:var(--muted);max-width:36ch}

/* escalera */
.ladder{width:100%;height:auto;display:block}
.big{font-size:56px;color:var(--mustard)}
.lv{font-size:26px}

/* rutina */
.tabs4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.tabs4 button{min-height:52px;padding:6px 4px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font-size:14px;line-height:1.15}
.tabs4 button.on{background:var(--mustard);border-color:var(--mustard);color:#000;font-weight:700}
.ex{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:14px;margin-bottom:12px}
.step-ex{display:flex;gap:12px;align-items:flex-start;padding:14px 14px 14px 10px}
.step-num{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;font-family:'Big Shoulders Display',sans-serif}
.step-body{flex:1;min-width:0}
.step-add{border-left-color:var(--mustard)}
.step-plus{background:var(--mustard);color:#000}
.logbox{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.unitsw{cursor:pointer;color:var(--mustard);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.02em}
.sem-banner{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--mustard);border-radius:8px;padding:8px 10px;margin:0 0 12px;font-size:12.5px;color:var(--text);cursor:pointer}
.sem-hint-x{background:transparent;border:0;color:var(--muted);font-size:15px;font-weight:900;line-height:1;cursor:pointer;padding:0;margin-left:auto;flex:0 0 auto}
.sem-navdot{display:block;width:12px;height:12px;border-radius:50%;border:1.5px solid #000;box-shadow:0 0 0 1px rgba(255,255,255,.25);margin:0 auto 2px}
.sem-red{background:#c8202b}.sem-yellow{background:#e0a81c}.sem-green{background:#2fa84f}
.sem-panel{text-align:left}
.sem-panel ul{list-style:none;margin:6px 0 0;padding:0;font-size:12.5px}
.sem-panel li{padding:3px 0;color:var(--muted)}
.sem-panel li.ok{color:var(--text)}
.moodrow{display:flex;gap:6px}
.moodbtn{flex:1;min-height:40px;border-radius:8px;border:1.5px solid var(--line);background:transparent;font-size:18px;cursor:pointer}
.moodbtn.on{border-color:var(--mustard);background:var(--mustard)}
.hm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hm-cell{display:block;width:100%;aspect-ratio:1;border-radius:3px}
.hm-empty{background:transparent}
.hm-grey{background:#2a2a2a}
.hm-green{background:#2fa84f}
.hm-yellow{background:#e0a81c}
.hm-red{background:#c8202b}
.hm-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
.tipbox{margin-top:14px;padding:9px 11px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;line-height:1.4;color:var(--muted)}
.tipbox b{color:var(--mustard)}
.logbox input{min-height:40px;padding:6px 8px;border-radius:7px;border:1.5px solid var(--line);background:#000;color:var(--text);font-size:15px;width:100%}
.ex h3{margin-bottom:2px}
.sets{color:var(--mustard);font-weight:700;margin-bottom:6px}
.ex ol{margin:6px 0 8px;padding-left:20px}
.ex li{margin-bottom:2px}
.tip{font-size:14px;color:var(--muted);margin-bottom:10px}
.callout{border:1.5px solid var(--mustard);border-radius:10px;padding:14px;margin-bottom:14px}
.callout b{color:var(--mustard)}

/* dieta */
.kcal{font-size:64px;color:var(--mustard)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center}
.macros div{background:#000;border:1px solid var(--line);border-radius:8px;padding:8px 4px}
.macros b{display:block;font-size:22px}
.meal{border-top:1px solid var(--line);padding:12px 0}
.meal:first-of-type{border-top:0}
.meal ul{margin:6px 0 0;padding-left:18px}
.meal .mt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}

/* seguimiento */
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-weight:600;text-align:left;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.tbl td{padding:5px 4px;border-bottom:1px solid var(--line)}
.tbl input{width:78px;min-height:38px;padding:4px 8px;border-radius:6px;border:1.5px solid var(--line);background:#000;color:var(--text);font-size:16px}
.scroll{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:0 8px}
.wide{overflow-x:auto}

/* contadores */
.stepper{display:flex;align-items:center;gap:12px}
.stepper .n{font-size:34px;min-width:64px;text-align:center}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--red)}

/* navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:#000;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px}
.nav .in5{grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--mustard)}

/* modal y aviso */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.ov .box{width:100%;max-width:420px;background:var(--surface);border:2px solid var(--mustard);border-radius:14px;padding:26px 22px;text-align:center}
.ov .box .btn{margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--mustard);color:#000;padding:10px 16px;border-radius:8px;font-weight:700;z-index:60;display:none;max-width:90%;text-align:center}
.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.pop{animation:none}}
.badge{background:var(--mustard);color:#000;font-weight:700;padding:3px 10px;border-radius:6px;font-size:14px;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.tile .v{font-size:32px;color:var(--mustard);margin:2px 0}
.gh{font-size:30px;margin:22px 0 8px;color:var(--text)}
ul.gl{margin:0 0 10px;padding-left:20px}
ul.gl li{margin-bottom:8px}
.foot{font-size:13px;color:var(--muted);margin:22px 0 10px;text-align:center}
.agtimer{position:fixed;right:14px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:30;display:none;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 16px;background:var(--mustard);color:#000;font:700 16px/1 'Barlow',system-ui,-apple-system,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.55);cursor:pointer;-webkit-tap-highlight-color:transparent}
.agtimer.show{display:flex}
.agtimer small{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.75}
.agtimer.run{background:#1e1e1e;color:var(--mustard);border:2px solid var(--mustard)}
.agtimer.run b{font-size:22px;font-variant-numeric:tabular-nums}
.agtimer.done{background:#2e9d5b;color:#fff;animation:agpulse .6s ease-in-out infinite alternate}
@keyframes agpulse{from{transform:scale(1)}to{transform:scale(1.08)}}
</style>

<script>
(function(){
'use strict';

/* ------------------------------------------------------------------ */
/* Configuración                                                        */
/* ------------------------------------------------------------------ */
/* Estos valores se cambian en el archivo config.js, sin tocar este código. */
var CFG_DEFAULTS = {
  brand:'AG Nutrition + Fitness', brandShort:'AG', brandSub:'Nutrition + Fitness', contactName:'AG',
  phone:'6621616567', email:'', countryCode:'52', logo:'', logoOnWhite:'true', appLink:''
};
var CFG = (function(){ var u=window.AG_CONFIG||{}, c={}; for(var k in CFG_DEFAULTS){ c[k]=(u[k]!==undefined&&u[k]!==null)?String(u[k]):CFG_DEFAULTS[k]; } return c; })();
var BRAND=CFG.brand, BRAND_SHORT=CFG.brandShort, BRAND_SUB=CFG.brandSub, CONTACT_NAME=CFG.contactName,
    CONTACT_PHONE=CFG.phone, CONTACT_EMAIL=CFG.email, COUNTRY=(String(CFG.countryCode).replace(/\D/g,'')||'52'),
    LOGO=CFG.logo, APP_LINK=CFG.appLink;
var FP = (BRAND_SHORT||'App').replace(/[^A-Za-z0-9]+/g,'') || 'App';   // prefijo de los archivos que se descargan
var PLATE = (String(CFG.logoOnWhite).toLowerCase()!=='false');
var LOGO_SHOW=false, LOGO_DATA=null, LOGO_RATIO=3, LOGO_IMG=null;
document.title = BRAND+': programa de 3 meses';
function contactDigits(){ var d=String(CONTACT_PHONE).replace(/\D/g,''); return (/x/i.test(CONTACT_PHONE)||d.length!==10)?'':d; }
function waLink(text){ var d=contactDigits(); return d ? 'https://wa.me/'+COUNTRY+d+'?text='+encodeURIComponent(text||'') : ''; }
function contactLine(){ return CONTACT_NAME+' | Tel. '+CONTACT_PHONE+(CONTACT_EMAIL?' | '+CONTACT_EMAIL:''); }
function loadLogo(){
  if(!LOGO) return;
  var im=new Image();
  im.onload=function(){
    LOGO_SHOW=true; LOGO_IMG=im;
    var nw=im.naturalWidth||300, nh=im.naturalHeight||100; LOGO_RATIO=nw/nh;
    try{ var sc=Math.min(1,600/nw), c=document.createElement('canvas'); c.width=Math.round(nw*sc); c.height=Math.round(nh*sc); c.getContext('2d').drawImage(im,0,0,c.width,c.height); LOGO_DATA=c.toDataURL('image/png'); }catch(e){ LOGO_DATA=null; }
    render();
  };
  im.onerror=function(){ LOGO_SHOW=false; };
  im.src=LOGO;
}
var KEY = 'peldano_v1';

/* ------------------------------------------------------------------ */
/* Utilidades                                                           */
/* ------------------------------------------------------------------ */
function $(s,r){ return (r||document).querySelector(s); }
/* Osito con parche en el ojo izquierdo: mismo rostro de antes, con el toque "rudo" en el parche, sin ceño fruncido. */
var BEAR_SVG = '<svg class="bear-ico" viewBox="0 0 48 48" aria-hidden="true" focusable="false">'+
  '<circle cx="11" cy="9" r="6.4"/><circle cx="37" cy="9" r="6.4"/>'+
  '<path d="M7 25 C7 14 15 7 24 7 C33 7 41 14 41 25 C41 35 34 41 24 41 C14 41 7 35 7 25 Z"/>'+
  '<circle cx="24" cy="31" r="5.2" fill="var(--bg,#000)"/>'+
  /* ojo derecho normal; ojo izquierdo cubierto por un parche negro con correa */
  '<circle cx="32.5" cy="22" r="2.7" fill="var(--bg,#000)"/>'+
  '<path d="M7 25 C7 14 15 7 24 7" fill="none" stroke="var(--bg,#000)" stroke-width="2" stroke-linecap="round"/>'+
  '<ellipse cx="15.5" cy="22" rx="6" ry="5.4" fill="var(--bg,#000)"/>'+
  '</svg>';
function markHtml(){
  if(LOGO && LOGO_SHOW) return '<img class="logo'+(PLATE?'':' bare')+'" src="'+esc(LOGO)+'" alt="'+esc(BRAND)+'">';
  return '<span class="lock">'+BEAR_SVG+'<span class="mark">'+esc(BRAND_SHORT)+'<i></i></span>'+(BRAND_SUB?'<span class="mk2">'+esc(BRAND_SUB)+'</span>':'')+'</span>';
}
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function firstName(){ var n=(S.profile&&S.profile.name)||''; return n.trim().split(/\s+/)[0]||''; }
function pad(n){ return (n<10?'0':'')+n; }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fromIso(s){ var a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function todayIso(){ return iso(new Date()); }
function addDays(s,n){ var d=fromIso(s); d.setDate(d.getDate()+n); return iso(d); }
function daysBetween(a,b){ return Math.round((fromIso(b)-fromIso(a))/86400000); }
function fmtDate(s){ return fromIso(s).toLocaleDateString('es-MX',{day:'numeric',month:'short'}); }
function r1(n){ return Math.round(n*10)/10; }
/* IMC, rango de peso saludable y meta sugerida a 3 meses, con el mismo ritmo seguro que usa el plan. */
function imcGuide(w,hCm){
  var hm=hCm/100, bmi=w/(hm*hm);
  var cat = bmi<18.5?'Bajo peso':(bmi<25?'Peso saludable':(bmi<30?'Sobrepeso':'Obesidad'));
  var minW=r1(18.5*hm*hm), maxW=r1(24.9*hm*hm);
  var rate = Math.min((bmi>=30?0.009:(bmi>=25?0.0075:0.005))*w, 1.2);
  var sug = bmi>24.9 ? Math.max(maxW, r1(w-rate*12)) : w;
  return {bmi:r1(bmi), cat:cat, minW:minW, maxW:maxW, suggested:r1(sug), rate:r1(rate)};
}
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function yt(q){ return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q); }

var mem = null;
function loadState(){
  try{ var r=localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){}
  if(mem){ try{ return JSON.parse(mem); }catch(e){} }
  return null;
}
/* Espejo en IndexedDB: segunda copia dentro del teléfono por si el navegador vacía localStorage. */
function idbOpen(){
  return new Promise(function(res,rej){
    try{
      var q=indexedDB.open('ag_store',1);
      q.onupgradeneeded=function(){ q.result.createObjectStore('kv'); };
      q.onsuccess=function(){ res(q.result); };
      q.onerror=function(){ rej(q.error); };
    }catch(e){ rej(e); }
  });
}
function idbPut(v){
  return idbOpen().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,KEY);
      tx.oncomplete=function(){ res(true); }; tx.onerror=function(){ rej(tx.error); };
    });
  });
}
function idbGet(){
  return idbOpen().then(function(db){
    return new Promise(function(res,rej){
      var r=db.transaction('kv','readonly').objectStore('kv').get(KEY);
      r.onsuccess=function(){ res(r.result||null); }; r.onerror=function(){ rej(r.error); };
    });
  });
}
function persist(){
  var s=JSON.stringify(S);
  try{ localStorage.setItem(KEY,s); }catch(e){ mem=s; }

  try{ if(S.profile||S.accessOk) idbPut(s).catch(function(){}); }catch(e){}
}

/* ------------------------------------------------------------------ */
function computePlan(p){
  var w=p.weight, h=p.height, a=p.age;
  var bmr = 10*w + 6.25*h - 5*a + (p.sex==='h'?5:-161);
  var act = {3:1.4,4:1.5,5:1.55,6:1.6}[p.days] || 1.5;
  var tdee = Math.round(bmr*act);
  var floorK = p.sex==='h'?1500:1200;
  var hm = h/100, bmi = w/(hm*hm), minGoal = 18.5*hm*hm;
  var mode = p.priority, goal = p.goal, note = '';
  if(mode==='bajar'){
    if(bmi<18.5 || w<=minGoal+0.5){ mode='mantener'; goal=w; note='Tu peso ya está en un rango bajo, así que el plan se enfoca en mantenerte y ganar fuerza.'; }
    else if(goal<minGoal){ goal=Math.ceil(minGoal); note='Ajustamos tu meta a '+goal+' kg, el mínimo saludable para tu estatura.'; }
  }
  if(mode!=='bajar' && !(goal>0)) goal=w;
  var kcal, rate=0;
  if(mode==='bajar'){
    var pct = bmi>=30?0.009:(bmi>=25?0.0075:0.005);
    rate = Math.min(pct*w, 1.2);
    var deficit = Math.min(rate*1100, tdee*0.30);
    kcal = Math.round((tdee-deficit)/10)*10;
    if(kcal<floorK) kcal=floorK;
    rate = Math.max(0.2, (tdee-kcal)*7/7700);
    rate = Math.round(rate*20)/20;
  } else if(mode==='definir'){
    kcal = Math.max(floorK, Math.round(tdee*0.90/10)*10);
    rate = goal<w ? Math.round(Math.max(0.2,(tdee-kcal)*7/7700)*20)/20 : 0;
  } else { kcal = tdee; rate = 0; }
  var expFactor = {principiante:1.6, intermedio:1.8, avanzado:2.0}[p.experience] || 1.8;
  var protRef = mode==='bajar' ? Math.min(1.6*w, 2.0*goal) : (mode==='definir' ? Math.min(expFactor*w, (expFactor+0.4)*Math.max(goal,w*0.9)) : 1.4*w);
  var protein = Math.round(protRef/5)*5;
  var fat = Math.round(kcal*0.27/9);
  var carbs = Math.round((kcal-protein*4-fat*9)/4);
  if(carbs<100){ carbs=100; fat=Math.max(30,Math.round((kcal-protein*4-400)/9)); }
  var waterL = Math.min(4.5, Math.max(2.0, Math.round(35*w/100)/10));
  var cups = Math.ceil(waterL*4);
  var fiber = Math.min(38, Math.max(25, Math.round(14*kcal/1000)));
  var H;
  H = 12;   // el programa siempre dura 3 meses; si la meta llega antes, las semanas restantes son de estabilización
  var moving = (rate>0 && goal<w);
  var g12 = moving ? r1(Math.max(goal, w-rate*H)) : r1(w);
  return {
    goal12:g12,
    tdee:tdee,kcal:kcal,protein:protein,fat:fat,carbs:carbs,waterL:waterL,cups:cups,fiber:fiber,
    rate:rate,goal:goal,mode:mode,H:H,note:note,bmi:bmi,
    cardioPer: mode==='bajar'?15:10, cardioDay: mode==='bajar'?40:30,
    curve:function(k){ var kk=Math.min(k,H); return moving ? r1(Math.max(goal, w-rate*kk)) : r1(w); }
  };
}

function buildMeal(t,K,P){
  var pr=F[t.pr], ca=t.ca?F[t.ca]:null, ft=t.fat?F[t.fat]:null, fx=t.fx||{k:0,p:0,text:''};
  var lines=[], kcal=0, prot=0, n, g;
  var sc=Math.max(1,PLAN.kcal/2000);
  var pTarget=Math.max(10,(P-(fx.p||0))*0.92);
  if(pr.u1){
    n=Math.round(pTarget/pr.p); n=Math.max(pr.min||1,n); if(pr.max) n=Math.min(pr.max,n);
    lines.push(qty(pr,n)); kcal+=n*pr.k; prot+=n*pr.p;
  } else {
    g=Math.max(60,Math.round(pTarget/pr.p*10)*10); g=Math.min(g,Math.round((pr.gmax||300)*Math.sqrt(sc)/10)*10);
    lines.push(g+' g de '+pr.l); kcal+=g*pr.k/100; prot+=g*pr.p/100;
  }
  if(ft){ lines.push(qty(ft,1)); kcal+=ft.k; }
  if(fx.text){ lines.push(fx.text); kcal+=fx.k||0; prot+=fx.p||0; }
  var vegK = t.veg ? 40 : 0;
  if(ca){
    var rem=K-kcal-vegK;
    if(ca.u1){ n=Math.max(1,Math.round(rem/ca.k)); n=Math.min(Math.round((ca.max||6)*sc),n); lines.splice(1,0,qty(ca,n)); kcal+=n*ca.k; prot+=n*ca.p; }
    else { g=Math.max(30,Math.round(rem/ca.k*10)*10); g=Math.min(g,Math.round((ca.gmax||300)*sc/10)*10); lines.splice(1,0,g+' g de '+ca.l); kcal+=g*ca.k/100; prot+=g*ca.p/100; }
  }
  var rem2=K-kcal-vegK;
  if(rem2>=70){
    if(t.m==='x' && nutsOk()){ var al=F.almendras; n=Math.min(al.max,Math.round(rem2/al.k)); if(n>=1){ lines.push(qty(al,n)); kcal+=n*al.k; prot+=n*al.p; } }
    else { g=Math.min(250,Math.round(rem2*2/10)*10); if(g>=50){ lines.push(g+' g de fruta picada'+(t.m==='x'?'':' de postre')); kcal+=g*0.5; } }
  }
  if(t.veg) lines.push(t.veg+' (a libre)');
  return {name:t.n,lines:lines,kcal:Math.round(kcal+vegK),prot:Math.round(prot)};
}

function ladderSVG(step,frac){
  var base=Math.floor(Math.max(0,step)/10)*10, out='';
  for(var i=1;i<=10;i++){
    var abs=base+i, h=16+i*9, w=26, x0=(i-1)*29+2, y0=118-h;
    if(abs<=step){ out+='<rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+h+'" fill="#c8202b"/>'; }
    else if(abs===step+1){
      out+='<rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+h+'" fill="none" stroke="#e0a81c" stroke-width="2"/>';
      var fh=Math.max(0,Math.min(1,frac))*h;
      if(fh>0) out+='<rect x="'+x0+'" y="'+(118-fh)+'" width="'+w+'" height="'+fh+'" fill="#e0a81c"/>';
    } else { out+='<rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+h+'" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>'; }
  }
  return '<svg class="ladder" viewBox="0 0 296 122" role="img" aria-label="Escalera de peldaños: '+step+' logrados">'+out+'</svg>';
}

/* Bitácora real: S.logs[fecha][claveEjercicio] = {w:pesoKg, r:reps, s:series, min:minutos, sec:segundos} */
function logKey(name){ return norm(name).replace(/[^a-z0-9]+/g,'_').slice(0,40); }
function logDay(d){ d=d||todayIso(); if(!S.logs) S.logs={}; if(!S.logs[d]) S.logs[d]={}; return S.logs[d]; }
function logGet(name,d){ return logDay(d)[logKey(name)]||null; }

/* Historial de una clave de ejercicio a lo largo del tiempo, ordenado por fecha */
function logHistory(name){
  var key=logKey(name), out=[];
  Object.keys(S.logs||{}).sort().forEach(function(d){ var e=S.logs[d][key]; if(e) out.push({date:d,data:e}); });

}

function validateStep(){
  var a=Number(draft.age), hh=Number(draft.height), w=Number(draft.weight), g=Number(draft.goal);
  if(step===1){
    if(!draft.name || !draft.name.trim()) return 'Escribe tu nombre.';

    if(!(hh>=120&&hh<=220)) return 'Escribe tu estatura en centímetros, entre 120 y 220.';
    if(!(w>=35&&w<=250)) return 'Escribe tu peso actual en kilos, entre 35 y 250.';
    if(!draft.ok) return 'Marca la casilla para continuar.';
  }
  if(step===2 && draft.priority==='bajar'){
    if(!(g>0)) return 'Escribe tu peso meta.';
    if(g>=w) return 'Tu peso meta debe ser menor que tu peso actual.';
    var minG=18.5*Math.pow(hh/100,2);
    if(g<minG-0.01) return 'Con tu estatura, una meta menor a '+Math.ceil(minG)+' kg no es saludable. Elige una mayor.';
  }
  return '';
}

function plateau(){
  var ks=Object.keys(S.weights).map(Number).sort(function(a,b){ return a-b; });
  if(ks.length<1) return '';
  var last=S.weights[ks[ks.length-1]].kg;
  var prev = ks.length>1 ? S.weights[ks[ks.length-2]].kg : S.profile.weight;
  if(PLAN.rate>0 && last>=prev-0.05) return 'La báscula se detuvo esta semana. Es normal: el cuerpo retiene líquido. Sigue el plan, sube el cardio 10 minutos y revisa el sueño y el agua.';
  return '';
}

function heatmap90(){

  var cells=[], counts={green:0,yellow:0,red:0,grey:0};
  for(var i=0;i<pad;i++) cells.push(null);
  for(var i=0;i<totalDays;i++){

    counts[c]++; cells.push({d:d,c:c});

        if(cur) lns.push(cur);

        doc.setFont('helvetica','normal'); doc.setTextColor(gr,gr,gr);
        var ls=doc.splitTextToSize(clean(b.text),W-ind);
        need(ls.length*4.6+1);

        y+=1.2;
      }
    } else if(b.t==='stats'){
      var ns=b.items.length, gp=3, bw2=(W-gp*(ns-1))/ns, bh2=21; need(bh2+5);
      b.items.forEach(function(it,ix){

function toMd(B){

    else if(b.t==='grid') { o.push('| '+b.head.join(' | ')+' |'); o.push('|'+b.head.map(function(){return '---';}).join('|')+'|'); b.rows.forEach(function(r){ o.push('| '+r.join(' | ')+' |'); }); }
  });
  return o.join('\n');

function weightTrend(fromK,toK){
  var rows=weekRows().filter(function(r){ return r.k>=fromK && r.k<=toK && r.real!=null; });
  if(rows.length<2) return null;
  return {start:rows[0],end:rows[rows.length-1],delta:r1(rows[rows.length-1].real-rows[0].real)};
}
function exerciseDeltas(fromD,toD){
  var keys={}, out=[];
  Object.keys(S.logs||{}).forEach(function(d){ if(d>=fromD && d<=toD) Object.keys(S.logs[d]).forEach(function(k){ keys[k]=1; }); });
  Object.keys(keys).forEach(function(k){
    var pts=Object.keys(S.logs).filter(function(d){ return d>=fromD && d<=toD && S.logs[d][k] && S.logs[d][k].w!=null; }).sort();
    if(pts.length<1) return;
    var first=S.logs[pts[0]][k].w, last=S.logs[pts[pts.length-1]][k].w;
    out.push({name:displayNameForKey(k),first:first,last:last,delta:r1(last-first),count:pts.length});
  });
  return out.sort(function(a,b){ return b.delta-a.delta; });
}
function coachConclusions(fromK,toK,fromD,toD,label){
  var C=[], trend=weightTrend(fromK,toK), deltas=exerciseDeltas(fromD,toD);
  if(trend){
    if(trend.delta<-0.05) C.push('Bajó '+Math.abs(trend.delta).toFixed(1)+' kg en '+label+' (de '+trend.start.real.toFixed(1)+' a '+trend.end.real.toFixed(1)+' kg). Va en la dirección correcta.');
    else if(trend.delta>0.05) C.push('Subió '+trend.delta.toFixed(1)+' kg en '+label+'. Vale la pena revisar porciones, agua y sueño de estos días.');
    else C.push('El peso se mantuvo estable en '+label+'. Si la meta es bajar, revisar si el déficit calórico sigue vigente.');
  } else {
    C.push('No hay suficientes pesadas registradas en '+label+' para ver una tendencia clara. Conviene pesarse cada semana, siempre en las mismas condiciones.');
  }
  var improved=deltas.filter(function(d){ return d.delta>0; });
  var dropped=deltas.filter(function(d){ return d.delta<0; });
  if(improved.length) C.push('Subió de peso en '+improved.length+' ejercicio(s), el que más avanzó: '+improved[0].name+' ('+improved[0].first+' kg a '+improved[0].last+' kg).');
  if(dropped.length) C.push('Bajó de peso en '+dropped.length+' ejercicio(s); revisar técnica o si hubo fatiga/descanso insuficiente en esas sesiones.');
  if(!deltas.length) C.push('No se capturaron pesos de ejercicios en '+label+'. Recordar anotar peso, series y repeticiones reales en cada sesión.');
  var daysWon=0, daysTot=0;
  Object.keys(S.done||{}).forEach(function(d){ if(d>=fromD && d<=toD){ daysTot++; if(dayWon(S.done[d])) daysWon++; } });
  if(daysTot) C.push('Días completos (sesión + agua + sueño + menú): '+daysWon+' de '+daysTot+' días con registro.');
  return C;
}
function coachBlocks(scope){

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]'); if(!el) return;
  var a=el.dataset.a;
  if(el.tagName==='INPUT' && el.type==='checkbox'){ if(H[a]) H[a](el); return; }
  if(H[a]){ e.preventDefault(); H[a](el); }
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset && el.dataset.in){
    var k=el.dataset.in;
    if(el.type==='checkbox') draft[k]=el.checked; else draft[k]=el.value;
  }
  if(el.dataset && el.dataset.log){
    var field=el.dataset.logf, name=el.dataset.logn, v=el.value;
    var rec=logGet(name)||{};
    if(v===''){ delete rec[field]; }
    else {
      var num=parseFloat(v);
      if(!isNaN(num)){
        if(field==='w' && el.dataset.logu==='lb') num=lbToKg(num);   // siempre se guarda en kg
        rec[field]=num;
      }
    }
    logSet(name,rec);
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset && el.dataset.a==='extraGrpSel'){ H.extraGrpSel(el); return; }
  if(el.dataset && el.dataset.a==='progSel'){ ui.progEx=el.value; render(); return; }
  if(el.dataset && el.dataset.wk){
    var k=Number(el.dataset.wk), v=parseFloat(el.value);
    if(isNaN(v)){ delete S.weights[k]; }
    else if(v>=30&&v<=300){ S.weights[k]={kg:r1(v),date:(S.weights[k]&&S.weights[k].date)||addDays(S.profile.start,7*k)}; }
    else { toast('Escribe un peso válido en kilos.'); }
    persist(); render(); checkLevelUp();
  } else if(el.id==='impF' && el.files && el.files[0]){
    var fr=new FileReader();
    fr.onload=function(){
      try{ var o=JSON.parse(fr.result); if(!o||!o.profile) throw new Error('x'); S=o; persist(); render(); toast('Respaldo restaurado'); }
      catch(err){ toast('Ese archivo no es un respaldo válido.'); }
    };
    fr.readAsText(el.files[0]);
  }
});

/* Si la app se abre fuera de Claude (hosting propio), las descargas usan el navegador. */
if(!(window.claude && window.claude.use)){

}
/* Ícono de la app: AG FITNESS grande y medio osito asomando abajo, discreto. */
function drawAppIcon(c,size){
  var g=c.getContext('2d'), k=size/180; c.width=size; c.height=size;
  g.fillStyle='#000'; g.fillRect(0,0,size,size);
  g.save(); g.translate(size/2,size); g.scale(k*0.8,k*0.8); g.translate(-32,-37);
  g.fillStyle='#e0a81c';
  g.beginPath(); g.arc(14.5,12,8.5,0,7); g.fill();
  g.beginPath(); g.arc(49.5,12,8.5,0,7); g.fill();
  g.beginPath(); g.moveTo(9,33); g.quadraticCurveTo(9,15,32,15); g.quadraticCurveTo(55,15,55,33);
  g.quadraticCurveTo(55,53,32,53); g.quadraticCurveTo(9,53,9,33); g.closePath(); g.fill();
  g.fillStyle='#000';
  g.beginPath(); g.arc(44,29,3.6,0,7); g.fill();
  g.beginPath(); g.ellipse(20,29,7.3,6.4,0,0,7); g.fill();
  g.strokeStyle='#000'; g.lineWidth=2.4; g.beginPath(); g.moveTo(9,15); g.lineTo(27,27); g.stroke();
  g.restore();
  g.textAlign='center'; g.textBaseline='alphabetic';
  g.fillStyle='#e0a81c'; g.font='900 '+(100*k)+'px "Arial Black","Big Shoulders Display",Impact,sans-serif';
  g.fillText('AG',size/2,98*k);
  g.fillStyle='#f4f4f4'; g.font='700 '+(20*k)+'px Barlow,Arial,sans-serif';
  var word='FITNESS', sp=5*k, w=0, i; for(i=0;i<word.length;i++) w+=g.measureText(word[i]).width+sp; w-=sp;
  var x=size/2-w/2; g.textAlign='left';
  for(i=0;i<word.length;i++){ g.fillText(word[i],x,128*k); x+=g.measureText(word[i]).width+sp; }
  g.fillStyle='#c8202b'; g.fillRect(size/2-15*k,136*k,30*k,4*k);
}
function setBearFavicon(){

/* Temporizador de descanso (3 min). Vive fuera de #app para no reiniciarse al cambiar de pantalla. */
var TIMER_SECS=180, tmEnd=0, tmTimer=null, tmDone=false, tmCtx=null, tmEl=null;
function tmBeep(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    if(!tmCtx) tmCtx=new AC(); if(tmCtx.state==='suspended') tmCtx.resume();
    for(var i=0;i<3;i++){ (function(i){
      var o=tmCtx.createOscillator(), g=tmCtx.createGain(), t=tmCtx.currentTime+i*0.45;
      o.type='sine'; o.frequency.value=880; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
      o.connect(g); g.connect(tmCtx.destination); o.start(t); o.stop(t+0.4); })(i); }
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]); }catch(e){}
}
function tmFmt(sec){ var m=Math.floor(sec/60), r=sec%60; return m+':'+(r<10?'0':'')+r; }
function tmDraw(){
  if(!tmEl) return;
  if(tmDone){ tmEl.className='agtimer show done'; tmEl.innerHTML='<b>¡Listo!</b><small>toca</small>'; return; }
  if(tmEnd){ var left=Math.max(0,Math.ceil((tmEnd-Date.now())/1000)); tmEl.className='agtimer show run'; tmEl.innerHTML='<b>'+tmFmt(left)+'</b><small>parar</small>'; return; }
  tmEl.className='agtimer show'; tmEl.innerHTML='<span aria-hidden="true">⏱</span><b>3:00</b><small>descanso</small>';
}
function tmTick(){
  if(!tmEnd) return;
  if(Date.now()>=tmEnd){ tmEnd=0; tmDone=true; clearInterval(tmTimer); tmTimer=null; tmBeep(); }
  tmDraw();
}
function tmClick(){
  if(tmDone){ tmDone=false; tmDraw(); return; }
  if(tmEnd){ tmEnd=0; clearInterval(tmTimer); tmTimer=null; tmDraw(); return; }
  try{ var AC=window.AudioContext||window.webkitAudioContext; if(AC){ if(!tmCtx) tmCtx=new AC(); if(tmCtx.state==='suspended') tmCtx.resume(); } }catch(e){}
  tmEnd=Date.now()+TIMER_SECS*1000; tmTimer=setInterval(tmTick,250); tmDraw();
}
function syncTimer(){
  if(!tmEl){
    tmEl=document.createElement('button'); tmEl.type='button'; tmEl.className='agtimer'; tmEl.setAttribute('aria-label','Temporizador de descanso de 3 minutos');
    tmEl.addEventListener('click',tmClick); document.body.appendChild(tmEl); tmDraw();
  }
  var inMain=!!(S.profile && !ui.howto && !ui.welcome);
  var on=inMain && (ui.tab==='rutina' || tmEnd || tmDone);   // en reposo solo en Rutina; si corre o terminó, se ve en cualquier pestaña
  if(on) tmDraw(); else tmEl.className='agtimer';
}
